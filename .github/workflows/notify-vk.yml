name: Notify VK about new release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send message to VK
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          PEER_ID: ${{ secrets.VK_CHAT_IDS }}
        run: |
          ARTICLE_URL="https://vk.ru/@weifox-vk-mini-app-5-verst"

          MESSAGE="🚀 Я обновился до версии 2.0!
          
          📦 Загружаю информацию о нашем парке и новые улучшения.
          📝 Подробности обновления доступны по кнопке ниже."

          MESSAGE=$(echo -e "$MESSAGE" | sed ':a;N;$!ba;s/\n/%0A/g')

          KEYBOARD='{"inline":true,"buttons":[[{"action":{"type":"open_link","link":"'"$ARTICLE_URL"'","label":"📖 Читать об обновлении"}}]]}'

          curl -s -X POST "https://api.vk.com/method/messages.send" \
            -d "peer_id=${PEER_ID}" \
            -d "message=${MESSAGE}" \
            -d "keyboard=${KEYBOARD}" \
            -d "random_id=0" \
            -d "access_token=${VK_TOKEN}" \
            -d "v=5.131"
