name: Weekly Stats Bot

on:
  schedule:
    # Важно: время на серверах GitHub указано в UTC (Гринвич).
    # Московское время = UTC + 3. 
    # Чтобы запуск был в воскресенье в 09:00 по Москве, тут мы пишем 06:00.
    - cron: '0 6 * * 0'
  
  # Позволяет запускать скрипт вручную с сайта GitHub (для проверки)
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Stats Bot
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python stats_bot.py
